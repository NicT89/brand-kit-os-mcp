name: Tag release

# Tags v<version> when a sync PR is merged into main and the version in server.json is new.
# Runs in this public repo using its own GITHUB_TOKEN. The monorepo stays the single source
# of truth; this only creates the git tag that matches what just landed on main. server.json
# only changes when the upstream SERVER_VERSION bumps, so code-only syncs don't create tags.

on:
  push:
    branches: [main]
    paths:
      - "server.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag if the version is new
        run: |
          set -euo pipefail
          VERSION=$(jq -r '.version' server.json)
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "::error::No version found in server.json"; exit 1
          fi
          TAG="v${VERSION}"
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q .; then
            echo "${TAG} already exists — nothing to tag."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "Release ${TAG}"
          git push origin "${TAG}"
          echo "Tagged ${TAG}."
